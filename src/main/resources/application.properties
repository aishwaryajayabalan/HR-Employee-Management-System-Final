
# ==========================================
# Application Configuration
# ==========================================
spring.application.name=HR-Employee-Management-System
server.port=8080

# ==========================================
# MySQL Database Configuration
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hr_employee_management_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# HikariCP Connection Pool
# ==========================================
spring.datasource.hikari.pool-name=HREmployeeHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# JPA and Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Actuator
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# ==========================================
# Caching
# ==========================================
spring.cache.type=simple

# ==========================================
# Logging
# ==========================================
logging.level.root=INFO
logging.level.com.example.hr=DEBUG
logging.level.org.springframework.security=INFO


# ==========================================
# Spring Security
# ==========================================
spring.security.user.name=${APP_SECURITY_USERNAME}
spring.security.user.password=${APP_SECURITY_PASSWORD}


